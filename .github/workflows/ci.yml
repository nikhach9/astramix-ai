name: AstraMix CI

on:
  push:
    branches: [main, master, 'fix/**', 'feat/**']
  pull_request:
    branches: [main, master]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, mbstring
          coverage: none
      - run: python -m pip install -r backend/requirements.txt
      - name: Python tests and PHP model/search parity
        env:
          PYTHONPATH: backend/src:backend
        run: python -m pytest -q backend/tests
      - name: Prepare isolated market database from versioned sources
        run: python backend/scripts/prepare_market_snapshot.py "$RUNNER_TEMP/astramix-ci.db"
      - name: PHP API and market tests
        env:
          ASTRAMIX_MARKET_DB_PATH: '${{ runner.temp }}/astramix-ci.db'
        run: php astramix_php/tests/run_tests.php

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:reports
      - run: npm run build
