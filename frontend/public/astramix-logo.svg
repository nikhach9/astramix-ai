  </g>
  <!-- Wordmark: AstraMix in #102B46, AI in #0284C7 -->
  <text x="68" y="43" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="800" letter-spacing="-0.5" fill="#102B46">AstraMix</text>
  <text x="216" y="43" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="600" letter-spacing="-0.5" fill="#0284C7">AI</text>
