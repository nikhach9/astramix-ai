    <!-- Left Mint/Emerald Green Leg -->
    <polygon points="4,96 50,4 50,38 26,96" fill="#2BC089" />
    <!-- Top Teal Shoulder Facet -->
    <polygon points="50,4 67,38 50,38" fill="#14A08E" />
